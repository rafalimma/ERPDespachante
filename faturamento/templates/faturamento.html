{% extends "base.html" %}
{% load static %}

{% block title %}Faturamento{% endblock %}

{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="{% static 'home/css/style.css' %}">
    <script src="{% static 'home/js/javascript.js' %}"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap">
    <title>Ordem de serviço</title>
</head>
<style>
    body {
        font-family: 'Poppins', sans-serif;
    }
</style>
<body>
    <div id="mySidebar" class="sidebar bg-dark">
        <a href="{% url 'cadastro_clientes' %}">
            Clientes
        </a>
        <a href="{% url 'ordem_servico' %}">
            Ordem de Serviço
        </a>
        <a href="{% url 'servicos' %}">
            Serviços
        </a>
        <a href="{% url 'usuarios' %}">
            Usuários
        </a>
        <a href="{% url 'relatorios' %}?periodo=mensal">
            Relatórios
        </a>
        <a href="{% url 'faturamento' %}">
            Faturamento
        </a>
    </div>
    <div class="container mt-3 custom-container">
        <div class="d-flex justify-content-start align-items-center">
            <h1 class="me-auto text-success">Faturamento</h1>
        </div>
        <p> em desenvolvimento </p>

    </div>
    {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                <p>{{ message }}</p>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
    {% endfor %}

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
</body>
</html>
{% endblock %}
