{% extends "base.html" %}
{% load static %}

{% block title %}Editar Serviços{% endblock %}
{% block content %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap">
    <title>Document</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .custom-container {
          margin-left: 110px; /* Ajuste conforme necessário */
          margin-right: 100px; /* Ajuste conforme necessário */
        }
        .alert-success {
        color: #155724;
        background-color: #d4edda;
        border-color: #c3e6cb;
        padding: 5px;
        margin: 5px 0;
        }
        .alert-error {
        color: rgb(158, 4, 4);
        background-color: #e3b2b0;
        border-color: #c3e6cb;
        padding: 5px;
        margin: 5px 0;
        }
        .hover-link {
          color: black; 
          transition: color 0.3s ease; 
        }
    
        .hover-link:hover {
          color: green; 
          text-decoration: underline; 
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .readonly-input {
        background-color: #e3e7e9;
        border: none;
        box-shadow: none;
        color: #414344;
        padding-left: 0;
        }
        .obs {
            border: 2px solid #d3d3d3;
        }
    </style>
</head>
<body>
    <div class="container mt-3 custom-container">
        <div class="d-flex justify-content-start align-items-center">
            <h2 class="me-auto text-success">Novo Serviço</h2>
        </div>
    </div>
    {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                <p>{{ message }}</p>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    <div class="container">
        <form id="formadicao" action="{% url 'adicao_servico' %}" method="post" enctype="multipart/form-data">{% csrf_token %}
            <div class="row">
                <div class="col">
                    <label for="inputDescricao" class="form-label">Descrição</label>
                    <input name="descricao" type="text" class="form-control readonly-input" id="inputDescricao">
                </div>
                <div class="col">
                    <label for="inputCusto" class="form-label">Custo do Serviço</label>
                    <input name="custo" type="text" class="form-control readonly-input" id="inputCusto">
                </div>
                <div class="col">
                    <label for="inputVl" class="form-label">Valor liquido</label>
                    <input name="valor_liquido" type="text" class="form-control readonly-input" id="inputVl">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="inputVt" class="form-label">Valor Total</label>
                    <input name="valor_total" type="text" class="form-control readonly-input" id="inputVt">
                </div>
                <div class="col">
                    <label for="inputTd" class="form-label">Taxas do Detran</label>
                    <input name="taxa_detran" type="text" class="form-control readonly-input" id="inputTd">
                </div>
                <div class="col">
                    <label for="inputVl" class="form-label">Notas</label>
                    <textarea class="form-control readonly-input obs" id="notas" name="notas" rows="5" cols="40"></textarea><br>
                </div>
            </div>
            <div class="d-flex justify-content-end align-items-center" style="margin-top: 70px;">
                <button type="submit" class="btn btn-success me-3 mt-4">Salvar</button>
                <a href="{% url 'servicos' %}" class="btn btn-secondary me-4 mt-4">Voltar</a>
            </div>
        </form>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
        // Seleciona os campos de valores
        const valorLiquido = document.getElementById('inputVl');
        const valorTotal = document.getElementById('inputVt');
        const taxaDetran = document.getElementById('inputTd');
        const custo = document.getElementById('inputCusto');

        function formatCurrency(input) {
            let value = input.value.replace(/\D/g, ''); // Remove todos os caracteres não numéricos
            if (value.length > 0) {
                value = (value / 100).toFixed(2); // Divide por 100 e fixa em duas casas decimais
                input.value = value.replace('.', ','); // Substitui o ponto decimal por vírgula
            } else {
                input.value = '';
            }
        }

        // Adiciona evento de input para formatar conforme o usuário digita
        valorLiquido.addEventListener('input', function() {
            formatCurrency(valorLiquido);
        });

        valorTotal.addEventListener('input', function() {
            formatCurrency(valorTotal);
        });

        taxaDetran.addEventListener('input', function() {
            formatCurrency(taxaDetran);
        });
        custo.addEventListener('input', function() {
            formatCurrency(custo);
        });
    });
    </script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
</body>
</html>

{% endblock %}
