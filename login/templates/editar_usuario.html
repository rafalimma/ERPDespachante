{% extends 'base.html' %}
{% block title %} Usuários {% endblock %}
{% block content %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap">
    <title>Editar Usuário</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .custom-container {
            margin-left: 110px; /* Ajuste conforme necessário */
            margin-right: 100px; /* Ajuste conforme necessário */
        }
        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
            padding: 5px;
            margin: 5px 0;
        }
        .alert-error {
            color: rgb(158, 4, 4);
            background-color: #e3b2b0;
            border-color: #c3e6cb;
            padding: 5px;
            margin: 5px 0;
        }
        .readonly-input {
            background-color: #e3e7e9;
            border: none;
            box-shadow: none;
            color: #414344;
            padding-left: 0;
            }
    </style>
</head>
<body>
    <div class="container mt-3 custom-container">
        <div class="d-flex justify-content-start align-items-center">
            <h2 class="me-auto text-success">Editar Usuário</h2>
        </div>
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                <p>{{ message }}</p>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    </div>
    <div class="container">
        <form id="EditarForm" action="{% url 'form_edicao_usuario' %}" enctype="multipart/form-data" method="post"> {% csrf_token %}
            <div class="row">
                <div class="col-md-4 form-group">
                  <label class="form-label text-success">Identificador:</label>
                  <input type="number" name="id_usuario" class="form-control readonly-input" readonly value="{{ usuario.pk }}">
                </div>
                <div class="col-md-4 form-group">
                  <label class="form-label">Nome do usuário:</label>
                  <input type="text" name="username" class="form-control readonly-input" value="{{ usuario.username }}">
                </div>
                <div class="col-md-4 form-group">
                    <label class="form-label">E-mail:</label>
                    <input type="email" name="email" class="form-control readonly-input" value="{{ usuario.email }}">
                </div>
              </div>
              <div class="row">
                    <div class="col-md-4 form-group">
                        <label class="form-label">Primeiro nome:</label>
                        <input type="text" name="first_name" class="form-control readonly-input" value="{{ usuario.first_name }}">
                    </div>
                    <div class="col-md-4 form-group">
                        <label class="form-label">Segundo nome:</label>
                        <input type="text" name="second_name" class="form-control readonly-input" value="{{ usuario.last_name }}">
                    </div>
                    <div class="mt-3 mb-3 form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="status" name="status" {% if usuario.is_active %}checked{% endif %}>
                        <label class="form-check-label">Usuário Ativo</label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Grupos</label>
                        <select multiple class="form-control readonly-input" id="groups" name="group">
                            {% for group in groups %}
                                <option value="{{ group.id }}" selected>{{ group.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
              </div>
            <div class="d-flex justify-content-end align-items-center" style="margin-top: 25px;">
                <button type="submit" class="btn btn-success me-3 mt-4">Salvar</button>
                <a href="{% url 'usuarios' %}" class="btn btn-secondary me-4 mt-4">Voltar</a>
            </div>
        </form>
    </div>
    <script>
        var checkbox = document.getElementById('status');

        checkbox.addEventListener('change', function() {
            if (!chackbox.checked) {
                checkbox.value = 2;
            }
        })
    </script>
</body>
</html>

{% endblock %}
