{% extends "base.html" %}
{% load static %}

{% block title %}Novo Cliente{% endblock %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap">
    <title>Novo Cliente</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .custom-container {
            margin-left: 110px; /* Ajuste conforme necessário */
            margin-right: 100px; /* Ajuste conforme necessário */
        }
        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
            padding: 5px;
            margin: 5px 0;
        }
        .alert-error {
            color: rgb(158, 4, 4);
            background-color: #e3b2b0;
            border-color: #c3e6cb;
            padding: 5px;
            margin: 5px 0;
        }
        .readonly-input {
            background-color: #e3e7e9;
            border: none;
            box-shadow: none;
            color: #414344;
            padding-left: 0;
            }
    </style>
</head>
<body>
    <div class="container mt-3 custom-container">
        <div class="d-flex justify-content-start align-items-center">
            <h2 class="me-auto text-success">Novo Cliente</h2>
        </div>
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                <p>{{ message }}</p>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}

        <form id="cadastroForm" action="{% url 'cadastro_clientes' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col">
                    <label for="inputName" class="form-label">Nome *</label>
                    <input autocomplete="off" required value="{{ form_data.name|default_if_none:'' }}" name="name" type="text" class="form-control readonly-input" id="inputName" placeholder="Nome" style="text-transform: uppercase";>
                </div>
                <div class="col">
                    <label for="inputEmail" class="form-label">Email</label>
                    <input name="email" type="email" value="{{ form_data.email|default_if_none:'' }}" class="form-control readonly-input" id="inputEmail" placeholder="E-mail" autocomplete="off">
                </div>
                <div class="col position-relative">
                    <!-- Dropdown com posicionamento absoluto -->
                    <div class="position-absolute d-flex align-items-center" style="top: -5px; margin-left: 110px;">
                        <label for="cpfoucnpj" class="form-label" style="font-size: 0.9em; margin-bottom: 2px;">Escolha CPF ou CNPJ *</label>
                        <select name="escolha" id="cpfoucnpj" class="form-select form-select-sm" style="width: 100px;" required>
                            <option value="cpf">CPF</option>
                            <option value="cnpj">CNPJ</option>
                        </select>
                    </div>
            
                    <!-- Campo de entrada de CPF/CNPJ -->
                    <label for="cpfcnpj" class="form-label">CPF / CNPJ *</label>
                    <input name="cpfcnpj" maxlength="18" id="cpfcnpj" required type="text" 
                           value="{{ form_data.cpfcnpj|default_if_none:'' }}" 
                           class="form-control readonly-input" 
                           placeholder="CPF" autocomplete="off">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="inputFones" class="form-label">Telefone *</label>
                    <input name="telefone" required id="telefone" type="text" value="{{ form_data.telefone|default_if_none:'' }}" class="form-control readonly-input" placeholder="Telefone" autocomplete="off">
                </div>
                <div class="col">
                    <label for="inputCEP" class="form-label">CEP</label>
                    <input name="cep" type="number" value="{{ form_data.cep|default_if_none:'' }}" class="form-control readonly-input" id="inputCep" placeholder="CEP" autocomplete="off">
                </div>
                <div class="col">
                    <label for="inputEstado" class="form-label">Estado</label>
                    <input name="estado" type="text" value="{{ form_data.estado|default_if_none:'' }}" class="form-control readonly-input" id="inputEstado" placeholder="Estado" autocomplete="off">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="inputCidade" class="form-label">Cidade</label>
                    <input name="cidade" type="text" value="{{ form_data.cidade|default_if_none:'' }}" class="form-control readonly-input" id="inputCidade" placeholder="Cidade" autocomplete="off">
                </div>
                <div class="col">
                    <label for="inputBairro" class="form-label">Bairro</label>
                    <input name="bairro" type="text" value="{{ form_data.bairro|default_if_none:'' }}" class="form-control readonly-input" id="inputBairro" placeholder="Bairro" autocomplete="off">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="inputNum" class="form-label">Número</label>
                    <input name="numero" type="number" value="{{ form_data.numero|default_if_none:'' }}" class="form-control readonly-input" id="inputNum" placeholder="Numero" autocomplete="off">
                </div>
            </div>
            <div class="d-flex justify-content-end align-items-center" style="margin-top: 70px;">
                <button type="submit" class="btn btn-success me-3 mt-4">Salvar</button>
                <a href="{% url 'clientes' %}" class="btn btn-secondary me-4 mt-4">Voltar</a>
            </div>
        </form>
    </div>

    <script>
        let celular = document.getElementById('telefone');
        let cpfcnpj = document.getElementById('cpfcnpj');
        let cpfOucnpj = document.getElementById('cpfoucnpj');

        cpfOucnpj.addEventListener("change", function() {
            if (cpfOucnpj.value == "cnpj") {
                cpfcnpj.placeholder = "CNPJ";
            } else if (cpfOucnpj.value == "cpf") {
                cpfcnpj.placeholder = "CPF";
            }
        });

        cpfcnpj.addEventListener("keypress", function() {
            let inputLength = cpfcnpj.value.length;
            
            // Verifica a opção escolhida e aplica a formatação
            if (cpfOucnpj.value === "cpf") {
                cpfcnpj.setAttribute("maxlength", "14");
                cpfcnpj.placeholder = "CPF";
                if (inputLength === 3 || inputLength === 7) {
                    cpfcnpj.value += ".";
                } else if (inputLength === 11) {
                    cpfcnpj.value += "-";
                }
            } else if (cpfOucnpj.value === "cnpj") {
                cpfcnpj.setAttribute("maxlength", "18");
                cpfcnpj.placeholder = "CNPJ";
                if (inputLength === 2 || inputLength === 6) {
                    cpfcnpj.value += ".";
                } else if (inputLength === 10) {
                    cpfcnpj.value += "/";
                } else if (inputLength === 15) {
                    cpfcnpj.value += "-";
                }
            }
        });

        celular.addEventListener("input", function() {
            let limparValor = celular.value.replace(/\D/g, "").substring(0,11);
            
            let numerosArray = limparValor.split("");

            let numeroFormatado = "";

            if (numerosArray.length > 0) {
                numeroFormatado += `(${numerosArray.slice(0,2).join("")})`
            }
            if (numerosArray.length > 2){
                numeroFormatado += ` ${numerosArray.slice(2,7).join("")}`
            }
            if (numerosArray.length > 7) {
                numeroFormatado += `-${numerosArray.slice(7,11).join("")}`
            }
            celular.value = numeroFormatado;
        })

    </script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
</body>
</html>

{% endblock %}
