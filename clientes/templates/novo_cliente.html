{% extends "base.html" %}
{% load static %}

{% block title %}Novo Cliente{% endblock %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap">
    <title>Novo Cliente</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .custom-container {
            margin-left: 110px; /* Ajuste conforme necessário */
            margin-right: 100px; /* Ajuste conforme necessário */
        }
        .alert-success {
            color: #155724;
            background-color: #d4edda;
            border-color: #c3e6cb;
            padding: 5px;
            margin: 5px 0;
        }
        .alert-error {
            color: rgb(158, 4, 4);
            background-color: #e3b2b0;
            border-color: #c3e6cb;
            padding: 5px;
            margin: 5px 0;
        }
        .readonly-input {
            background-color: #e3e7e9;
            border: none;
            box-shadow: none;
            color: #414344;
            padding-left: 0;
            }
    </style>
</head>
<body>
    <div class="container mt-3 custom-container">
        <div class="d-flex justify-content-start align-items-center">
            <h2 class="me-auto text-success">Novo Cliente</h2>
        </div>
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                <p>{{ message }}</p>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}

        <form id="cadastroForm" action="{% url 'cadastro_clientes' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col">
                    <label for="inputName" class="form-label">Nome</label>
                    <input name="name" type="text" class="form-control readonly-input" id="inputName" placeholder="Nome" style="text-transform: uppercase";>
                </div>
                <div class="col">
                    <label for="inputEmail" class="form-label">Email</label>
                    <input name="email" type="email" class="form-control readonly-input" id="inputEmail" placeholder="E-mail">
                </div>
                <div class="col">
                    <label for="inputCpfCnpj" class="form-label">CPF / CNPJ</label>
                    <input name="cpfcnpj" type="number" class="form-control readonly-input" id="inputCpfCnpj" placeholder="CPF / CNPJ">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="inputFones" class="form-label">Telefone</label>
                    <input name="telefone" type="number" class="form-control readonly-input" id="inputFones" placeholder="Telefone">
                </div>
                <div class="col">
                    <label for="inputCEP" class="form-label">CEP</label>
                    <input name="cep" type="number" class="form-control readonly-input" id="inputCep" placeholder="CEP">
                </div>
                <div class="col">
                    <label for="inputEstado" class="form-label">Estado</label>
                    <input name="estado" type="text" class="form-control readonly-input" id="inputEstado" placeholder="Estado">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="inputCidade" class="form-label">Cidade</label>
                    <input name="cidade" type="text" class="form-control readonly-input" id="inputCidade" placeholder="Cidade">
                </div>
                <div class="col">
                    <label for="inputBairro" class="form-label">Bairro</label>
                    <input name="bairro" type="text" class="form-control readonly-input" id="inputBairro" placeholder="Bairro">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label for="inputNum" class="form-label">Número</label>
                    <input name="numero" type="number" class="form-control readonly-input" id="inputNum" placeholder="Numero">
                </div>
            </div>
            <div class="d-flex justify-content-end align-items-center" style="margin-top: 70px;">
                <button type="submit" class="btn btn-success me-3 mt-4">Salvar</button>
                <a href="{% url 'clientes' %}" class="btn btn-secondary me-4 mt-4">Voltar</a>
            </div>
        </form>
    </div>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
</body>
</html>

{% endblock %}
