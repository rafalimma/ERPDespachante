{% extends "base.html" %}
{% load static %}

{% block title %}Consulta Clientes{% endblock %}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .readonly-input {
            background-color: #f8f9fa;
            border: none;
            box-shadow: none;
            color: #495057;
            padding-left: 0;
        }
        .readonly-input:focus {
            border: none;
            box-shadow: none;
        }
    </style>
    <title>Consulta Clientes</title>
</head>

<body>
    <div class="container mt-3 custom-container">
        <div class="d-flex justify-content-start align-items-center">
            <h2 class="me-auto text-success">Dados do Cliente</h2>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-4 form-group">
                <label class="text-success">Nome:</label>
                <input type="text" class="form-control readonly-input" value="{{ cliente.name }}" readonly>
            </div>
            <div class="col-md-4 form-group">
                <label class="text-success">CPF / CNPJ:</label>
                <input type="text" class="form-control readonly-input" value="{{ cliente.cpf_cnpj }}" readonly>
            </div>
            <div class="col-md-4 form-group">
                <label class="text-success">Telefone:</label>
                <input type="number" class="form-control readonly-input" value="{{ cliente.telefone }}" readonly>
            </div>
        </div>
        <div class="row" style="margin-top: -15px;">
            <div class="col-md-4 form-group">
                <label class="text-success">Email:</label>
                <input type="text" class="form-control readonly-input" value="{{ cliente.email }}" readonly>
            </div>
            <div class="col-md-4 form-group">
                <label class="text-success">Cep:</label>
                <input type="text" class="form-control readonly-input" value="{{ cliente.cep }}" readonly>
            </div>
            <div class="col-md-4 form-group">
                <label class="text-success">Numero:</label>
                <input type="number" class="form-control readonly-input" value="{{ cliente.numero }}" readonly>
            </div>
        <div class="row" style="margin-top: -15px;">
            <div class="col-md-4 form-group">
                <label class="text-success">Bairro:</label>
                <input type="text" class="form-control readonly-input" value="{{ cliente.bairro }}" readonly>
            </div>
            <div class="col-md-4 form-group">
                <label class="text-success">Estado:</label>
                <input type="text" class="form-control readonly-input" value="{{ cliente.estado }}" readonly>
            </div>
            <div class="col-md-4 form-group">
                <label class="text-success">Cidade:</label>
                <input type="number" class="form-control readonly-input" value="{{ cliente.cidade }}" readonly>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-start align-items-center mt-4">
        <h2 class="me-auto text-success">Ordens de Serviço</h2>
    </div>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
</body>
</html>
{% endblock %}
