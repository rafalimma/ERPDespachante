{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title %}{% endblock  %}</title>
    <style>
        #Divoptions {
            display: none;
            position: absolute;
            background-color: #333;
            color: white;
            padding: 0px;
            border-radius: 5px;
            z-index: 1000;
        }

        #Divoptions div {
            padding: 10px;
            border-bottom: 1px solid #555;
            cursor: pointer;
        }

        #Divoptions div:hover {
            background-color: rgb(238, 232, 232);
            color: black;
        }

        #Divoptions div:last-child {
            border-bottom: none;
        }

        /* Estilo para a divisória */
        .navbar-divider {
            width: 1px;
            height: 55px; /* Altura da divisória */
            background-color: #666;
            margin: 12px 5px 12px 0; /* Espaçamento entre a imagem e o perfil */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand bg-dark" style="height: 65px;">
        <div class="container-fluid">
            <a href="#">
                <img src="{% static 'images/logo1.png' %}" style="width: 55px;">
            </a>
        </div>
        <a href="{% url 'home' %}" style="text-decoration: none;">
            <img src="{% static 'images/home.png' %}" title="VOLTAR PARA A HOME" style="width: 40px; margin-right: 18px;">
        </a>

        <!-- Divisória -->
        <div class="navbar-divider"></div>

        <div class="container user-div" id="profile" style="width: 200px; cursor: pointer;">
            {% if user.is_superuser %}
                <img src="{% static 'images/master.png' %}" title="MASTER USER" style="width: 30px; margin-right: 0px;">
            {% else %}
                <img src="{% static 'images/user_profile.png' %}" title="USUÁRIO" style="width: 26px; margin-right: 0px;">
            {% endif %}

            {% if user.is_authenticated %}
                <h5 class="text-white mt-2" style="font-size: large;">{{ user.username }}</h5>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-2" id="Divoptions" style="width: 200px;">
        <a href="{% url 'editar_usuario' user.id %}" style="color: inherit; text-decoration: none;">
            <div class="d-flex align-items-center p-2" style="width: 100%;">
                <img src="{% static 'images/see_profile.png' %}" style="width: 25px; margin-right: 8px;">
                <span>Meu Perfil</span>
            </div>
        </a>
        <a href="{% url 'logout' %}" style="color: inherit; text-decoration: none;">
            <div class="d-flex align-items-center p-2" style="width: 100%;">
                <img src="{% static 'images/logout.png' %}" style="width: 26px; margin-right: 8px;">
                <span>Sair</span>
            </div>
        </a>
        <a href="#" style="color: inherit; text-decoration: none;">
            <div class="d-flex align-items-center p-2" style="width: 100%;">
                <img src="{% static 'images/about.png' %}" style="width: 25px; margin-right: 8px;">
                <span>Sobre</span>
            </div>
        </a>
    </div>

    {% block content %}
    <!-- O conteúdo específico da página -->
    {% endblock %}

    <div class="text-center">
        <p>run by Deesp</p>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#profile').click(function(event) {
                event.stopPropagation(); // Impede que o clique feche a div imediatamente
                var divOptions = $('#Divoptions');
                var profileOffset = $(this).offset();
                divOptions.css({
                    top: profileOffset.top + $(this).height(),
                    left: profileOffset.left
                }).toggle();
            });

            // Esconde a div se clicar fora dela
            $(document).click(function() {
                $('#Divoptions').hide();
            });

            // Impede o fechamento ao clicar dentro da div
            $('#Divoptions').click(function(event) {
                event.stopPropagation();
            });
        });

    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
